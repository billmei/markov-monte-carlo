name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-flight runs are allowed to finish rather than being
# cancelled, so Pages is never left mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Deliberately repeated from ci.yml rather than chained off it: a broken
      # build must never reach the published site, and workflow_run coupling
      # would make that guarantee depend on run ordering.
      - name: Test
        run: bun test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # `bun run build` also runs `tsc --noEmit`. BASE_PATH comes from the Pages
      # config rather than being hardcoded, so this keeps working if the repo is
      # renamed or moved to a custom domain (where base_path is "/").
      - name: Build
        run: bun run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
